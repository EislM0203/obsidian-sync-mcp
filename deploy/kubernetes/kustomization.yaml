apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian-sync-mcp
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # The Secret is created with kubectl, not committed — see secret.example.yaml.
images:
  - name: harbor.cloud.traunseenet.com/library/obsidian-sync-mcp
    newTag: latest   # pin with: kustomize edit set image harbor.cloud.traunseenet.com/library/obsidian-sync-mcp:<tag>
