# Template only — kustomization.yaml does NOT include this file, so real
# credentials never end up in git. Create the Secret instead with:
#
#   kubectl -n obsidian-sync-mcp create secret generic obsidian-sync-mcp \
#     --from-literal=COUCHDB_PASSWORD='...' \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=COUCHDB_PASSPHRASE='...'   # only if LiveSync E2E encryption is on
#
apiVersion: v1
kind: Secret
metadata:
  name: obsidian-sync-mcp
  namespace: obsidian-sync-mcp
type: Opaque
stringData:
  COUCHDB_PASSWORD: "change-me"
  # Password for the OAuth login page and static Bearer token. Required when
  # exposed through an Ingress — without it the server only accepts localhost.
  MCP_AUTH_TOKEN: "change-me"
  # COUCHDB_PASSPHRASE: "your-livesync-e2e-passphrase"
